<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leanre</title>
  <meta name="description" content="A structural reading of Lean 4 formal proofs: dependency diagrams, findings, dossiers, blueprints and declaration search, each linked to the exact line of source.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101318'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%237cc4e4'%3El%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./xrefs.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar" role="banner">
      <div class="topbar-inner">
        <button type="button" class="icon-btn rail-toggle" id="railToggleBtn" title="Show or hide the outline" aria-label="Show or hide the outline" aria-controls="outlineRail" aria-expanded="true">☰</button>
        <div class="brand-wrap">
          <a class="brand" href="#overview" id="brandLink" aria-label="leanre home">
            <span class="brand-name">leanre</span>
          </a>
          <span class="brand-repo" id="brandRepo"></span>
          <div class="proj-switch hidden" id="projSwitch"></div>
        </div>

        <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
          <a class="nav-tab" href="#overview" data-route="overview" id="tab-overview">Overview</a>
          <a class="nav-tab" href="#circuit" data-route="circuit" id="tab-circuit">Diagrams</a>
          <a class="nav-tab" href="#findings" data-route="findings" id="tab-findings">Findings</a>
          <a class="nav-tab" href="#dossiers" data-route="dossiers" id="tab-dossiers">Dossiers</a>
          <a class="nav-tab" href="#blueprints" data-route="blueprints" id="tab-blueprints">Blueprints</a>
          <a class="nav-tab" href="#flirt" data-route="flirt" id="tab-flirt">Clusters</a>
          <a class="nav-tab hidden" href="#atlas" data-route="atlas" id="tab-atlas">Edge Map</a>
          <a class="nav-tab hidden" href="#xrefs" data-route="xrefs" id="tab-xrefs">Cross-refs</a>
          <a class="nav-tab" href="#portability" data-route="portability" id="tab-portability">Islands</a>
          <a class="nav-tab" href="#benchmarks" data-route="benchmarks" id="tab-benchmarks">Benchmarks</a>
        </nav>

        <div class="topbar-actions">
          <button type="button" class="search-trigger" id="quickSearchBtn" title="Search declarations (press /)" aria-label="Search declarations">
            <span class="st-lbl">Search</span>
            <kbd>/</kbd>
          </button>
          <button type="button" class="icon-btn" id="themeToggleBtn" title="Switch between dark and light" aria-label="Switch between dark and light theme">
            <span id="themeIcon">☀</span>
          </button>
          <a class="repo-link hidden" id="repoExtLink" target="_blank" rel="noopener noreferrer" title="Upstream proof repository being inspected (independent third-party credit, not affiliated with leanre)">Proof source ↗</a>
          <a class="repo-link" id="toolGhLink" href="https://github.com/bohemian-miser/leanre" target="_blank" rel="noopener noreferrer" title="leanre tool and explorer on GitHub">GitHub ↗</a>
        </div>
      </div>
    </header>

    <div class="body-wrap" id="bodyWrap">
      <aside class="outline-rail" id="outlineRail" aria-label="Outline"></aside>
      <div class="content-col">
        <nav class="crumb-bar hidden" id="crumbBar" aria-label="Breadcrumb"></nav>
        <main id="appMain" class="app-main" role="main">
          <div class="loading-card">
            <div class="spinner" aria-hidden="true"></div>
            <div>Loading…</div>
          </div>
        </main>
      </div>
    </div>

    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner" id="footerMeta">leanre · AGPL-3.0-or-later · <a href="https://github.com/bohemian-miser/leanre" target="_blank" rel="noopener noreferrer">leanre on GitHub ↗</a></div>
    </footer>
  </div>

  <div class="circuit-tip" id="circuitTip" role="tooltip"></div>
  <div class="sr-only" id="srAnnouncer" aria-live="polite" aria-atomic="true"></div>
  <script src="./xrefs.js" defer></script>
  <script src="./site.js" defer></script>
</body>
</html>
